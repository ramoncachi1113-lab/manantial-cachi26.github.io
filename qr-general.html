<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR General Único - Manantial de Cachi</title>
<style>body{font-family:sans-serif;background:#f8fafc;display:flex;flex-direction:column;align-items:center;padding:20px} .card{background:#fff;padding:24px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.1);max-width:500px;width:100%;text-align:center} .code{font-size:14px;color:#64748b;word-break:break-all;margin-top:10px} .btn{padding:12px 18px;border-radius:10px;border:none;font-weight:700;margin:6px;cursor:pointer} .btn-g{background:#16a36b;color:#fff} .btn-b{background:#063d5e;color:#fff}</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head><body>
<div class="card">
<h1 style="color:#063d5e">Manantial de Cachi</h1>
<h2>QR GENERAL ÚNICO</h2>
<p>Funciona aunque quede en CERO - Universal</p>
<div id="qrcode" style="display:flex;justify-content:center;margin:20px 0"></div>
<div class="code" id="linkText"></div>
<button class="btn btn-g" onclick="descargar()">Descargar PNG</button>
<button class="btn btn-b" onclick="probar()">Probar QR</button>
<button class="btn btn-b" onclick="copiar()">Copiar Link</button>
<p style="font-size:13px;color:#64748b;margin-top:12px">Pegá este QR en bidones 20L, mostrador, entrada. Cliente escanea → MODO CLIENTE → GPS Cachi &lt;2m</p>
</div>
<script>
const LINK = location.origin + '/cliente.html';
document.getElementById('linkText').textContent=LINK;
new QRCode(document.getElementById('qrcode'), {text: LINK, width:300, height:300});
function probar(){ window.open(LINK,'_blank'); }
function copiar(){ navigator.clipboard.writeText(LINK); alert('Copiado: '+LINK); }
function descargar(){
  const canvas=document.querySelector('#qrcode canvas');
  const a=document.createElement('a');
  a.download='qr-general-unico-manantial-cachi26.png';
  a.href=canvas.toDataURL();
  a.click();
}
</script>
</body></html>
